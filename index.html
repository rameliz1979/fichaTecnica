<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha Técnica - Desarrollo de Software | SENA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
    background: linear-gradient(160deg, #e9f5ee 0%, #f0f4f8 60%, #eaf3fd 100%);
    min-height: 100vh;
  }
  /* Header degradado */
  .app-header {
    background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 55%, #40916c 100%);
    box-shadow: 0 4px 20px rgba(27,67,50,.4);
  }
  /* Barra de progreso */
  .progress-wrap {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  #progress-bar {
    height: 6px;
    border-radius: 99px;
    transition: width .5s ease, background-color .4s ease;
  }
  /* Modal */
  .modal-card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    padding: 28px;
  }
  /* Footer */
  .app-footer {
    background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
    color: rgba(255,255,255,.55);
    font-size: .78rem;
    padding: 16px 24px;
    letter-spacing: .02em;
  }
</style>
</head>
<body class="min-h-screen font-sans">

  <!-- Header -->
  <header class="app-header text-white print:hidden">
    <div class="max-w-5xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <!-- Logo placeholder -->
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.2);">
          💻
        </div>
        <div>
          <h1 style="font-size:1rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.2;">
            SENA – Gestión de Proyectos
          </h1>
          <p style="font-size:.8rem;color:rgba(255,255,255,.75);margin-top:2px;">Ficha Técnica para Desarrollo de Software</p>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap justify-center sm:justify-end">
        <button id="btn-save" class="btn-action" style="background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);">
          <svg style="width:14px;height:14px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
          Guardar
        </button>
        <button id="btn-export" class="btn-action" style="background:rgba(124,58,237,.8);color:#fff;border:1px solid rgba(167,139,250,.4);" title="Exporta tu progreso como archivo .json para continuar en otro equipo">
          <svg style="width:14px;height:14px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Exportar
        </button>
        <label id="btn-import-label" class="btn-action" style="background:rgba(245,158,11,.85);color:#fff;border:1px solid rgba(251,191,36,.4);cursor:pointer;" title="Carga un archivo .json exportado previamente para continuar donde lo dejaste">
          <svg style="width:14px;height:14px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Importar
          <input id="btn-import" type="file" accept=".json" style="display:none;" />
        </label>
        <button id="btn-clear" class="btn-action" style="background:rgba(239,68,68,.8);color:#fff;border:1px solid rgba(239,68,68,.4);">
          <svg style="width:14px;height:14px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          Limpiar
        </button>
        <button id="btn-pdf" class="btn-action" style="background:rgba(37,99,235,.85);color:#fff;border:1px solid rgba(59,130,246,.4);">
          <svg style="width:14px;height:14px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Descargar PDF
        </button>
        <button id="btn-whatsapp" class="btn-action" style="background:rgba(21,128,61,.85);color:#fff;border:1px solid rgba(34,197,94,.4);">
          <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.526 5.845L.057 23.857a.5.5 0 00.614.614l6.033-1.472A11.943 11.943 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.8 9.8 0 01-5.006-1.374l-.357-.214-3.723.908.936-3.613-.233-.373A9.793 9.793 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
          WhatsApp
        </button>
      </div>
    </div>
  </header>

  <!-- Progress bar -->
  <div class="progress-wrap print:hidden">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center gap-3">
      <svg style="width:14px;height:14px;color:#6b7280;flex-shrink:0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      <span style="font-size:.78rem;color:#6b7280;font-weight:500;white-space:nowrap;">Progreso del formulario</span>
      <div style="flex:1;background:#e5e7eb;border-radius:99px;height:6px;overflow:hidden;">
        <div id="progress-bar" style="width:0%;background:#52b788;"></div>
      </div>
      <span id="progress-pct" style="font-size:.8rem;font-weight:700;color:#2d6a4f;min-width:36px;text-align:right;">0%</span>
    </div>
  </div>

  <!-- Formulario principal -->
  <main class="max-w-5xl mx-auto px-4 py-8 space-y-6" id="form-root">
    <!-- Las secciones se renderizan dinámicamente desde form.js -->
  </main>

  <!-- Footer -->
  <footer class="app-footer text-center print:hidden">
    SENA – Servicio Nacional de Aprendizaje &nbsp;·&nbsp; Ficha Técnica para Desarrollo de Software &nbsp;·&nbsp; v1.0 &nbsp;·&nbsp; 2026
  </footer>

  <!-- Modal de WhatsApp -->
  <div id="modal-wa" class="hidden fixed inset-0 flex items-center justify-center z-50" style="background:rgba(0,0,0,.45);backdrop-filter:blur(4px);">
    <div class="modal-card max-w-sm w-full mx-4">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
        <div style="width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#22c55e,#15803d);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(21,128,61,.3);">
          <svg style="width:20px;height:20px" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.117 1.526 5.845L.057 23.857a.5.5 0 00.614.614l6.033-1.472A11.943 11.943 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.8 9.8 0 01-5.006-1.374l-.357-.214-3.723.908.936-3.613-.233-.373A9.793 9.793 0 012.182 12C2.182 6.57 6.57 2.182 12 2.182S21.818 6.57 21.818 12 17.43 21.818 12 21.818z"/></svg>
        </div>
        <div>
          <h2 style="font-size:1.05rem;font-weight:700;color:#111827;margin:0;">Compartir por WhatsApp</h2>
          <p style="font-size:.78rem;color:#6b7280;margin:2px 0 0;">Se abre WhatsApp con el resumen pre-cargado</p>
        </div>
      </div>
      <label style="font-size:.8rem;font-weight:600;color:#374151;display:block;margin-bottom:6px;">Número de teléfono</label>
      <input id="wa-number" type="tel" value="3127200361" class="form-input" placeholder="Ej: 3127200361" style="margin-bottom:18px;" />
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="modal-wa-cancel" style="padding:9px 20px;font-size:.85rem;font-weight:600;border-radius:9px;border:1.5px solid #e5e7eb;background:#fff;color:#374151;cursor:pointer;transition:background .15s;">Cancelar</button>
        <button id="modal-wa-send" style="padding:9px 20px;font-size:.85rem;font-weight:600;border-radius:9px;border:none;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(21,128,61,.3);transition:filter .15s;">Enviar mensaje</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 z-50 print:hidden"
    style="background:linear-gradient(135deg,#1b4332,#2d6a4f);color:#fff;font-size:.85rem;font-weight:500;
           padding:12px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(27,67,50,.4);
           display:flex;align-items:center;gap:10px;min-width:200px;max-width:340px;letter-spacing:.01em;">
  </div>

  <!-- Librerías externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Capas JS (orden: data → services → ui → app) -->
  <script src="js/data/model.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/services/pdf.js"></script>
  <script src="js/services/share.js"></script>
  <script src="js/ui/form.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
